name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run validate
      - run: npm run build
      # Browser smoke needs the production build produced by the previous step.
      - name: Browser smoke (depends on build)
        timeout-minutes: 10
        env:
          # The smoke script launches Chromium sandboxed by default; opt out
          # only for CI containers, where the sandbox cannot start.
          PUPPETEER_NO_SANDBOX: "1"
        run: npm run test:browser
